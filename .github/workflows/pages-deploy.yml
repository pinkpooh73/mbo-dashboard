name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Covers direct commits/pushes to main (code changes, manual data.json edits).
  workflow_run:
    workflows: ["Sync data.json from Google Sheet"]
    types: [completed]
    # The sync job commits with the default GITHUB_TOKEN, and GitHub does not
    # let token-authored pushes re-trigger other workflows via the `push`
    # event (loop-prevention) — so data.json updates from sync.yml would
    # never reach Pages without this explicit workflow_run trigger.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble published site
        run: |
          mkdir -p _site
          cp index.html compute.js data.json raw-table.html _site/
          cp -r assets _site/
          # compute.js holds the dashboard's aggregate calculations (split out
          # of index.html so Node tests can require it) — index.html loads it
          # with a plain <script src>, so it must ship or the page is blank.
          # raw-table.html is the "KPI 데이터" tab's prerendered table, split
          # out of data.json (it was 78% of its size) — index.html fetches it
          # lazily when that tab is first opened, so it must be published
          # alongside data.json or that tab breaks.
          # index.html references assets/ (login-gate CI logo). Fonts/Chart.js
          # are loaded from CDNs by index.html itself, so nothing else is
          # required. Deliberately NOT publishing sync/, PRD docs, or
          # CLAUDE.md — the Pages URL only needs to serve the dashboard.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
