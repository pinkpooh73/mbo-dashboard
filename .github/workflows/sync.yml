name: Sync data.json from Google Sheet

on:
  repository_dispatch:
    types: [sheet-edited]
    # Fired by the Apps Script onEdit trigger bound to the sheet (see
    # sync/apps-script/onEditTrigger.gs) — this is the Phase 4 near-real-time
    # path, typically landing within ~30-60s of an edit (the Apps Script side
    # debounces rapid consecutive edits down to one call).
  schedule:
    # Kept as a fallback safety net, not replaced (Phase 4 decision — see
    # CLAUDE.md/PRD notes): if the Apps Script trigger silently stops firing
    # (quota exhaustion, script authorization revoked, trigger deleted...),
    # the dashboard would otherwise go stale with no visible symptom until
    # someone happens to notice. Worst case with both paths is 1h staleness,
    # same as before Phase 4; best case is ~1min.
    - cron: '0 * * * *'
  workflow_dispatch: {}
    # Manual "Run workflow" button in the Actions tab — use this to verify
    # the sync works end to end without waiting for the next hourly tick.

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sync/package-lock.json

      - name: Install sync dependencies
        working-directory: sync
        run: npm ci

      - name: Run sync
        working-directory: sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node sync.js
        # A structural validation failure (SheetStructureError) or a fetch
        # failure exits non-zero here, which fails this step *before* any
        # commit step runs — data.json on the default branch is left
        # untouched, and the failed run itself is GitHub's notification to
        # whoever watches this repo's Actions.

      - name: Commit data.json if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: sync data.json from Google Sheet [skip ci]"
          git push
