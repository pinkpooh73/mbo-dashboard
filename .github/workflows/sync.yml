name: Sync data.json from Google Sheet

on:
  repository_dispatch:
    types: [sheet-edited]
    # Fired by the Apps Script onEdit trigger bound to the sheet (see
    # sync/apps-script/onEditTrigger.gs) — this is now the ONLY automatic
    # path, typically landing within ~30-60s of an edit (the Apps Script side
    # debounces rapid consecutive edits down to one call).
    #
    # The hourly cron fallback that used to sit here was removed deliberately
    # (not an oversight): it ran unconditionally every hour regardless of
    # whether the sheet had changed, which the user flagged as wasted CI
    # minutes/API calls, and — now that detectChanges.js makes a no-op run a
    # true no-op — its main remaining value was as a safety net for a broken
    # webhook, not freshness. The user chose to drop that safety net in favor
    # of manual "Run workflow" (below) as the fallback instead. If the
    # webhook silently stops firing, the dashboard goes stale with no
    # automatic recovery until someone runs it by hand — see CLAUDE.md's
    # Phase 4 section for the full reasoning behind this trade.
  workflow_dispatch: {}
    # Manual trigger — this is what the dashboard's "데이터 갱신하기" sidebar
    # link points at (index.html links to this workflow's Actions page rather
    # than calling the API directly, so no access token has to be embedded in
    # the public page). Also useful for verifying the sync end to end without
    # waiting on a sheet edit.

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sync/package-lock.json

      - name: Install sync dependencies
        working-directory: sync
        run: npm ci

      - name: Run sync
        working-directory: sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          # Phase 5 — every var above is optional per-channel: if a channel's
          # config is incomplete, that channel is skipped (::warning:: only,
          # see sync/notify.js) without blocking the sync or the other
          # channel. ALERT_EMAIL_TO is a plain repo variable, not a secret —
          # an email address isn't sensitive on its own.
        run: node sync.js
        # A structural validation failure (SheetStructureError) or a fetch
        # failure exits non-zero here, which fails this step *before* any
        # commit step runs — data.json on the default branch is left
        # untouched, and the failed run itself is GitHub's notification to
        # whoever watches this repo's Actions.

      - name: Commit data.json / raw-table.html if changed
        run: |
          # sync.js leaves both files completely untouched when nothing
          # material changed (no updatedAt churn — see sync/detectChanges.js),
          # so this guard is a real short-circuit now: an unchanged sheet
          # produces no commit and therefore no Pages redeploy.
          if git diff --quiet -- data.json raw-table.html; then
            echo "No changes to data.json / raw-table.html."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json raw-table.html
          git commit -m "chore: sync data.json from Google Sheet [skip ci]"
          git push
