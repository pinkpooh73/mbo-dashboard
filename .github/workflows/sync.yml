name: Sync data.json from Google Sheet

on:
  schedule:
    # 매일 4회: 09:00 / 12:00 / 15:00 / 18:00 KST (= 00:00 / 03:00 / 06:00 /
    # 09:00 UTC — GitHub Actions cron is always UTC). 이전의 시간당(24회/일)
    # 폴링이 낭비라는 사용자 피드백으로 제거됐었는데, 완전 수동(웹훅+수동
    # 실행만)으로는 "자동으로 읽어오는" 요구를 충족하지 못해 다시 스케줄을
    # 두되 훨씬 낮은 빈도로 절충했다. detectChanges.js 덕분에 시트가 그대로면
    # 커밋/배포 없이 조용히 끝나므로, 실질 비용은 GitHub Actions 실행 시간
    # 4회/일 정도뿐이다.
    #
    # 요일 필터를 여기(cron 표현식)에 안 두고 주말/공휴일 판단은 전부
    # sync/isSkipDay.js 한 곳에서 하도록 몰아뒀다 — 로직이 cron 표현식과
    # 스크립트 두 군데로 쪼개지면 나중에 한쪽만 고치고 잊어버리기 쉽다.
    - cron: '0 0,3,6,9 * * *'
  repository_dispatch:
    types: [sheet-edited]
    # Fired by the Apps Script onEdit trigger bound to the sheet (see
    # sync/apps-script/onEditTrigger.gs) — near-real-time path, typically
    # landing within ~30-60s of an edit (the Apps Script side debounces
    # rapid consecutive edits down to one call). Still not attached to the
    # live sheet as of this writing; the schedule above is what actually
    # keeps data fresh until that setup is done. Never skipped for
    # weekends/holidays — an actual sheet edit should always sync.
  workflow_dispatch: {}
    # Manual trigger via `gh workflow run` or the Actions tab's "Run
    # workflow" button. Also never skipped for weekends/holidays.

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sync/package-lock.json

      - name: Skip scheduled runs on weekends/Korean public holidays
        id: skip_check
        working-directory: sync
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESULT=$(node isSkipDay.js)
          echo "skip=$RESULT" >> "$GITHUB_OUTPUT"
        # repository_dispatch(웹훅)나 workflow_dispatch(수동)로 트리거된
        # 실행은 이 체크를 건너뛰고 항상 진행됨 — 위 on: 블록 주석 참고.
        # sync/isSkipDay.js와 sync/holidays.txt 참고(테스트: sync/test/isSkipDay.test.js).

      - name: Install sync dependencies
        if: steps.skip_check.outputs.skip != 'true'
        working-directory: sync
        run: npm ci

      - name: Run sync
        if: steps.skip_check.outputs.skip != 'true'
        working-directory: sync
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Phase 5 — optional: if unset, detected anomalies still show up as
          # ::warning:: annotations on the run (see sync/notify.js), just no
          # Slack message gets sent. (The email channel that used to be here
          # was removed at the user's request — see business-rules.md §6.)
        run: node sync.js
        # A structural validation failure (SheetStructureError) or a fetch
        # failure exits non-zero here, which fails this step *before* any
        # commit step runs — data.json on the default branch is left
        # untouched, and the failed run itself is GitHub's notification to
        # whoever watches this repo's Actions.

      - name: Commit data.json / raw-table.html if changed
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          # sync.js leaves both files completely untouched when nothing
          # material changed (no updatedAt churn — see sync/detectChanges.js),
          # so this guard is a real short-circuit now: an unchanged sheet
          # produces no commit and therefore no Pages redeploy.
          if git diff --quiet -- data.json raw-table.html; then
            echo "No changes to data.json / raw-table.html."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json raw-table.html
          git commit -m "chore: sync data.json from Google Sheet [skip ci]"
          git push
